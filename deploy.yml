name: CI/CD Deployment

on:
  push:
    branches: [ main ] # Or your primary branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: 🚚 Checkout Repository
      uses: actions/checkout@v4

    - name: ⚙️ Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: '**/package-lock.json'

    - name: 🏗️ Build Frontend
      run: |
        cd frontend
        npm install
        npm run build

    - name: 📦 Deploy to VPS
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.KEY }}
        port: ${{ secrets.PORT || 22 }}
        source: "frontend/dist,backend"
        target: "/var/www/jclick"
        strip_components: 1

    - name: 🚀 Restart Application on VPS
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.KEY }}
        port: ${{ secrets.PORT || 22 }}
        script: |
          cd /var/www/jclick/backend
          docker build -t jclick-backend .
          docker stop jclick-backend-container || true
          docker rm jclick-backend-container || true
          docker run -d --name jclick-backend-container -p 5000:5000 --restart unless-stopped --env-file .env.production -v $(pwd)/uploads:/usr/src/app/uploads -v $(pwd)/logs:/usr/src/app/logs jclick-backend